name: Loadnote checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/vendor-program-readers.js
      - name: Dependency vulnerability gate
        shell: bash
        run: |
          # A dependency advisory must block the release. Retry only transient
          # registry failures (not a reported vulnerability) and fail closed.
          for attempt in 1 2 3; do
            audit_log="$(mktemp)"
            if npm audit --audit-level=moderate --fetch-timeout=90000 --fetch-retries=1 >"$audit_log" 2>&1; then
              cat "$audit_log"
              rm -f "$audit_log"
              exit 0
            fi
            cat "$audit_log"
            if ! grep -Eiq 'audit (5[0-9][0-9]|endpoint returned an error)|503 Service Unavailable|EAI_AGAIN|ETIMEDOUT|ECONNRESET' "$audit_log"; then
              rm -f "$audit_log"
              exit 1
            fi
            rm -f "$audit_log"
            if [ "$attempt" -eq 3 ]; then
              echo 'Security audit unavailable after three attempts; failing closed.'
              exit 1
            fi
            sleep 10
          done
      - run: npm run check
      - run: npm test
      - run: npm run check:mobile
      - run: npm run check:native
      - run: npm run check:beta
      - run: npx playwright install --with-deps chromium
      - name: Audit completion and fresh meet-setup regressions
        run: npx playwright test tests/browser/audit-regressions.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-regression-demo
          path: test-results/
          retention-days: 7
      - name: Demo cleanup handoff checks
        run: npx playwright test tests/browser/demo-cleanup.spec.js
      - name: Athlete journey acceptance
        run: npx playwright test tests/browser/athlete-journey.spec.js tests/browser/first-week.spec.js tests/browser/mobile-navigation.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athlete-journey-demo
          path: test-results/
          retention-days: 7
      - name: Weekly coaching and accessory progression checks
        run: npx playwright test tests/browser/weekly-coaching.spec.js tests/browser/coach-context.spec.js tests/browser/accessory-follow-up.spec.js tests/browser/accessory-review.spec.js tests/browser/accessory-programming.spec.js tests/browser/exercise-guidance.spec.js tests/browser/coach-conversation.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-coaching-demo
          path: test-results/
          retention-days: 7
      - name: Shared exercise guidance checks
        run: npx playwright test tests/browser/exercise-guidance.spec.js tests/browser/adaptive-session.spec.js tests/browser/unified-coach.spec.js tests/browser/meet-prep-setup.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exercise-guidance-demo
          path: test-results/
          retention-days: 7
      - name: Daily workout interface checks
        run: npx playwright test tests/browser/workout-flow.spec.js tests/browser/draft-recovery.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-workout-demo
          path: test-results/
          retention-days: 7
      - name: Whole-product feature demo
        run: npx playwright test tests/browser/feature-demo.spec.js tests/browser/interface-clarity.spec.js tests/browser/more.spec.js tests/browser/measurements.spec.js tests/browser/nutrition.spec.js tests/browser/history-reliability.spec.js tests/browser/profile.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-product-demo
          path: test-results/
          retention-days: 7
      - name: Cycle journal interface checks
        run: npx playwright test tests/browser/cycle-review.spec.js --grep "cycle journal|blocking journal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-timeline-demo
          path: test-results/
          retention-days: 7
      - name: Mobile flow demo and formatting checks
        run: npx playwright test tests/browser/mobile-flow.spec.js tests/browser/mobile-usability.spec.js tests/browser/mobile-layout.spec.js tests/browser/profile-uniformity.spec.js tests/browser/workflow-polish.spec.js tests/browser/meet-prep-setup.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-flow-demo
          path: test-results/
          retention-days: 7
      - name: Training loop demo and save-safety checks
        run: npx playwright test tests/browser/training-loop.spec.js tests/browser/gym-floor.spec.js tests/browser/clear-coaching.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-loop-demo
          path: test-results/
          retention-days: 7
      - name: Accessibility interaction smoke checks
        run: npx playwright test tests/browser/mobile-accessibility.spec.js
      - name: Proposal, Coach tabs and mobile RPE regressions
        run: npx playwright test tests/browser/coaching-review.spec.js tests/browser/v3-coaching.spec.js tests/browser/decisions-ux.spec.js tests/browser/logger.spec.js --grep "preview applies|shorter future|Decisions prioritizes|quick RPE"
      - name: Coach launcher and live workout context
        run: npx playwright test tests/browser/coach-companion.spec.js
      - name: Recovery interaction smoke checks
        run: npx playwright test tests/browser/mobile-reliability.spec.js
      - name: Accessory programming smoke checks
        run: npx playwright test tests/browser/accessory-programming.spec.js
      - name: Local conversation smoke checks
        run: npx playwright test tests/browser/coach-conversation.spec.js
      - name: Local AI conversation smoke checks
        run: npx playwright test tests/browser/coaching-library.spec.js tests/browser/local-companion-ai.spec.js
      - name: Athlete planning smoke checks
        run: npx playwright test tests/browser/athlete-planning.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  browser:
    name: Browser regressions (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/vendor-program-readers.js
      - run: npx playwright install --with-deps chromium
      - name: Full browser coverage shard
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  webkit:
    name: iPhone WebKit intake and first week
    runs-on: ubuntu-latest
    # Keep the official WebKit browsers and Linux system libraries matched to
    # package-lock's Playwright 1.62.1. The container avoids repeated apt
    # dependency-resolution stalls on ephemeral GitHub-hosted runners.
    # Pin the published OCI digest as well as the readable image version.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/vendor-program-readers.js
      - name: Verify pinned WebKit is installed
        run: |
          node -e "const fs=require('node:fs');const p=require('playwright');const lock=require('./package-lock.json');if(p.chromium===undefined||lock.packages['node_modules/playwright'].version!=='1.62.1'||!fs.existsSync(p.webkit.executablePath()))process.exit(1)"
      - run: npx playwright test tests/browser/program-review-fixes.spec.js tests/browser/coach-v381.spec.js tests/browser/coach-v380.spec.js tests/browser/coach-v379.spec.js tests/browser/coach-v378.spec.js tests/browser/coach-v377.spec.js tests/browser/coach-clarity.spec.js tests/browser/native-restore.spec.js tests/browser/first-week.spec.js tests/browser/mobile-navigation.spec.js tests/browser/guided-programming-ux.spec.js tests/browser/coach-action-navigation.spec.js tests/browser/calendar-day-actions.spec.js tests/browser/iphone-interface.spec.js tests/browser/offline-planning.spec.js tests/browser/appearance.spec.js --project=mobile-webkit --workers=2
        env:
          LOADNOTE_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-webkit-demo
          path: test-results/
          retention-days: 7
  test:
    if: always()
    needs: [smoke, browser, webkit]
    runs-on: ubuntu-latest
    steps:
      - name: Require all smoke checks and browser shards
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        run: |
          test "$SMOKE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$WEBKIT_RESULT" = success
