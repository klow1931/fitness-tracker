name: Loadnote checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run check:mobile
      - run: npm run check:native
      - run: npx playwright install --with-deps chromium
      - name: Shared exercise guidance checks
        run: npx playwright test tests/browser/exercise-guidance.spec.js tests/browser/adaptive-session.spec.js tests/browser/unified-coach.spec.js tests/browser/meet-prep-setup.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exercise-guidance-demo
          path: test-results/
          retention-days: 7
      - name: Daily workout interface checks
        run: npx playwright test tests/browser/workout-flow.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-workout-demo
          path: test-results/
          retention-days: 7
      - name: Whole-product feature demo
        run: npx playwright test tests/browser/feature-demo.spec.js tests/browser/interface-clarity.spec.js tests/browser/more.spec.js tests/browser/measurements.spec.js tests/browser/nutrition.spec.js tests/browser/history-reliability.spec.js tests/browser/profile.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-product-demo
          path: test-results/
          retention-days: 7
      - name: Cycle journal interface checks
        run: npx playwright test tests/browser/cycle-review.spec.js --grep "cycle journal|blocking journal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-timeline-demo
          path: test-results/
          retention-days: 7
      - name: Mobile flow demo and formatting checks
        run: npx playwright test tests/browser/mobile-flow.spec.js tests/browser/mobile-usability.spec.js tests/browser/mobile-layout.spec.js tests/browser/profile-uniformity.spec.js tests/browser/workflow-polish.spec.js tests/browser/meet-prep-setup.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-flow-demo
          path: test-results/
          retention-days: 7
      - name: Training loop demo and save-safety checks
        run: npx playwright test tests/browser/training-loop.spec.js tests/browser/gym-floor.spec.js tests/browser/clear-coaching.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-loop-demo
          path: test-results/
          retention-days: 7
      - name: Accessibility interaction smoke checks
        run: npx playwright test tests/browser/mobile-accessibility.spec.js
      - name: Proposal, Coach tabs and mobile RPE regressions
        run: npx playwright test tests/browser/coaching-review.spec.js tests/browser/v3-coaching.spec.js tests/browser/decisions-ux.spec.js tests/browser/logger.spec.js --grep "preview applies|shorter future|Decisions prioritizes|quick RPE"
      - name: Coach launcher and live workout context
        run: npx playwright test tests/browser/coach-companion.spec.js
      - name: Recovery interaction smoke checks
        run: npx playwright test tests/browser/mobile-reliability.spec.js
      - name: Accessory programming smoke checks
        run: npx playwright test tests/browser/accessory-programming.spec.js
      - name: Local conversation smoke checks
        run: npx playwright test tests/browser/coach-conversation.spec.js
      - name: Local AI conversation smoke checks
        run: npx playwright test tests/browser/coaching-library.spec.js tests/browser/local-companion-ai.spec.js
      - name: Athlete planning smoke checks
        run: npx playwright test tests/browser/athlete-planning.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  browser:
    name: Browser regressions (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Full browser coverage shard
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  test:
    if: always()
    needs: [smoke, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all smoke checks and browser shards
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$SMOKE_RESULT" = success
          test "$BROWSER_RESULT" = success
