name: Publish Loadnote web

on:
  workflow_run:
    workflows: [Loadnote checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node for offline reader bundling
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require all exact-head approved-main release gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOADNOTE_PUBLICATION_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/check-publication-gates.js
      - name: Bundle offline program readers
        run: npm ci --no-audit --no-fund
      - name: Verify release metadata and asset manifest
        run: npm run release:check
      - name: Require a single Pages publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pages-source.js
      - name: Package static web app
        run: |
          mkdir _site
          cp index.html privacy.html support.html delete-account.html app.js styles.css energy.css appearance.css manifest.webmanifest release.json sw.js apple-touch-icon.png icon-192.png icon-512.png _site/
          cp -R src assets _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the live release and every offline asset
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run release:verify -- "$DEPLOYED_URL"

  live-offline:
    name: Published offline workout recovery
    needs: deploy
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/vendor-program-readers.js
      - name: Verify settled live assets twice
        run: |
          npm run release:verify -- https://klow1931.github.io/fitness-tracker/
          sleep 15
          npm run release:verify -- https://klow1931.github.io/fitness-tracker/
      - name: Isolated live Chromium disconnected reload and save
        env:
          LOADNOTE_OFFLINE_URL: https://klow1931.github.io/fitness-tracker/
          LOADNOTE_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npx playwright test --config=playwright.offline.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadnote-offline-live
          path: |
            playwright-report/offline-live/
            test-results/offline-live/
          retention-days: 14
